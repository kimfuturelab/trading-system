name: Deploy Hynix Buyback Landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hynix-buyback-landing/**'
      - '.github/workflows/hynix-buyback-landing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload landing artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: hynix-buyback-landing
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
