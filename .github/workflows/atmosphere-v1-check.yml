name: atmosphere-v1-check
on:
  push:
    branches:
      - feature/atmosphere-v1
  workflow_dispatch:

jobs:
  pycompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ATMOSPHERE collector
        run: python -m py_compile collector/atmosphere_v1.py
